<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>_lpt_</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: 'Cinzel', serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Gold metallic shimmering text */
        .glow-title {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #FFE259 0%, #FFA751 30%, #FFD700 70%, #FFF8DC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6),
                         0 0 30px rgba(212, 175, 55, 0.4),
                         0 0 45px rgba(184, 134, 11, 0.2);
            pointer-events: none;
            animation: goldShimmer 4s ease-in-out infinite alternate;
        }

        @keyframes goldShimmer {
            0% {
                filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
                opacity: 0.85;
            }
            100% {
                filter: drop-shadow(0 0 20px rgba(255, 223, 0, 0.9));
                opacity: 1;
            }
        }

        /* iOS Gyroscope Request Permission Overlay if needed */
        #gyro-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(20, 15, 5, 0.7);
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            display: none;
        }
    </style>
</head>
<body>

    <!-- Title UI -->
    <div class="glow-title">_lpt_</div>

    <!-- Gyro Button for iOS -->
    <button id="gyro-btn">Cảm biến nghiêng</button>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let mainGroup, baguaGroup, sunMoonGroup;
        let sunMesh, moonMesh;
        
        // Physics & Rotation state
        let isDragging = false;
        let previousPointerAngle = 0;
        let angularVelocity = 0;
        let lastPointerTime = 0;
        let currentPointerAngle = 0;
        let isSpinningFast = false;
        let lastX = 0, lastY = 0;
        
        // Tilt orientation targets
        let targetTiltX = 0;
        let targetTiltY = 0;
        let currentTiltX = 0;
        let currentTiltY = 0;

        // Device Orientation
        let initialGyroSet = false;
        let baseAlpha = 0, baseBeta = 0, baseGamma = 0;

        function initScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030305, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 22);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Container Groups
            mainGroup = new THREE.Group(); // Tilts with mouse/gyro
            baguaGroup = new THREE.Group(); // Spins like wheel
            sunMoonGroup = new THREE.Group(); // Orbits around Bagua

            mainGroup.add(baguaGroup);
            mainGroup.add(sunMoonGroup);
            scene.add(mainGroup);

            setupLighting();
            createCosmicBackground();
            createBaguaWheel();
            createSunAndMoon();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            
            // Mouse & Touch events
            const dom = renderer.domElement;
            dom.addEventListener('pointerdown', onPointerDown);
            dom.addEventListener('pointermove', onPointerMove);
            dom.addEventListener('pointerup', onPointerUp);
            dom.addEventListener('pointercancel', onPointerUp);

            // Gyroscope setup
            setupGyroscope();

            // Window load start
            animate();
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xfffae6, 0.7);
            scene.add(ambientLight);

            // Main directional light casting golden specular highlights
            const mainLight = new THREE.DirectionalLight(0xffea9f, 2.2);
            mainLight.position.set(10, 15, 15);
            mainLight.castShadow = true;
            scene.add(mainLight);

            // Rim light for obsidian dark metallic depth
            const rimLight = new THREE.DirectionalLight(0xd4af37, 1.5);
            rimLight.position.set(-10, -10, -10);
            scene.add(rimLight);

            // Warm center point light
            const centerLight = new THREE.PointLight(0xffd700, 2.5, 15);
            centerLight.position.set(0, 0, 2);
            baguaGroup.add(centerLight);
        }

        function createCosmicBackground() {
            // Golden Dust & Stardust Particles
            const particleCount = 1200;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const scales = new Float32Array(particleCount);

            const goldColor = new THREE.Color(0xffd700);
            const amberColor = new THREE.Color(0xff8c00);
            const whiteColor = new THREE.Color(0xffffff);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 60;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 60;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 40 - 10;

                let c = Math.random() > 0.6 ? goldColor : (Math.random() > 0.3 ? amberColor : whiteColor);
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;

                scales[i] = Math.random() * 0.12 + 0.03;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const particleMaterial = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            const starField = new THREE.Points(geometry, particleMaterial);
            scene.add(starField);
        }

        function createBaguaWheel() {
            // Scale main Bagua smaller to allow breathing room
            baguaGroup.scale.set(0.72, 0.72, 0.72);

            // Materials
            const goldMaterial = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                metalness: 0.95,
                roughness: 0.18,
                envMapIntensity: 2.5
            });

            const darkObsidianMaterial = new THREE.MeshStandardMaterial({
                color: 0x0a0a0d,
                metalness: 0.8,
                roughness: 0.25,
            });

            const glowingGoldMaterial = new THREE.MeshBasicMaterial({
                color: 0xffea70
            });

            // 1. Outer Octagonal Frame
            const octShape = new THREE.Shape();
            const octRadius = 6.0;
            for (let i = 0; i < 8; i++) {
                const angle = (i * Math.PI / 4) + Math.PI / 8;
                const x = Math.cos(angle) * octRadius;
                const y = Math.sin(angle) * octRadius;
                if (i === 0) octShape.moveTo(x, y);
                else octShape.lineTo(x, y);
            }
            octShape.closePath();

            const extrudeSettings = { depth: 0.4, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: 0.12, bevelThickness: 0.12 };
            const frameGeo = new THREE.ExtrudeGeometry(octShape, extrudeSettings);
            frameGeo.center();
            const octFrame = new THREE.Mesh(frameGeo, darkObsidianMaterial);
            baguaGroup.add(octFrame);

            // Outer Gold Bezel Trim
            const bezelGeo = new THREE.TorusGeometry(5.8, 0.12, 16, 8);
            bezelGeo.rotateZ(Math.PI / 8);
            const bezelMesh = new THREE.Mesh(bezelGeo, goldMaterial);
            bezelMesh.position.z = 0.22;
            baguaGroup.add(bezelMesh);

            // 2. Trigrams (Quẻ Bát Quái: Càn, Đoài, Ly, Chấn, Tốn, Khảm, Cấn, Khôn)
            // 8 Trigram definitions: true = solid bar (Dương), false = broken bar (Âm)
            const trigrams = [
                [true, true, true],     // Càn ☰
                [false, true, true],    // Đoài ☱
                [true, false, true],    // Ly ☲
                [false, false, true],   // Chấn ☳
                [true, true, false],    // Tốn ☴
                [false, true, false],   // Khảm ☵
                [true, false, false],   // Cấn ☶
                [false, false, false]   // Khôn ☷
            ];

            trigrams.forEach((trigram, index) => {
                const angle = (index * Math.PI / 4) - Math.PI / 2;
                const trigramGroup = new THREE.Group();

                const barWidth = 1.3;
                const barHeight = 0.18;
                const barDepth = 0.12;
                const gap = 0.12;

                trigram.forEach((isSolid, barIdx) => {
                    const yPos = (barIdx - 1) * (barHeight + gap);

                    if (isSolid) {
                        const barGeo = new THREE.BoxGeometry(barWidth, barHeight, barDepth);
                        const barMesh = new THREE.Mesh(barGeo, goldMaterial);
                        barMesh.position.y = yPos;
                        trigramGroup.add(barMesh);
                    } else {
                        // Broken Bar
                        const halfWidth = (barWidth - 0.2) / 2;
                        const leftGeo = new THREE.BoxGeometry(halfWidth, barHeight, barDepth);
                        const rightGeo = new THREE.BoxGeometry(halfWidth, barHeight, barDepth);

                        const leftMesh = new THREE.Mesh(leftGeo, goldMaterial);
                        const rightMesh = new THREE.Mesh(rightGeo, goldMaterial);

                        leftMesh.position.set(-halfWidth / 2 - 0.1, yPos, 0);
                        rightMesh.position.set(halfWidth / 2 + 0.1, yPos, 0);

                        trigramGroup.add(leftMesh);
                        trigramGroup.add(rightMesh);
                    }
                });

                const dist = 4.7;
                trigramGroup.position.set(Math.cos(angle) * dist, Math.sin(angle) * dist, 0.25);
                trigramGroup.rotation.z = angle + Math.PI / 2;
                baguaGroup.add(trigramGroup);
            });

            // 3. Inner Decorative Rings & Mirror Rim
            const innerRingGeo = new THREE.TorusGeometry(3.6, 0.08, 16, 64);
            const innerRing = new THREE.Mesh(innerRingGeo, goldMaterial);
            innerRing.position.z = 0.22;
            baguaGroup.add(innerRing);

            const mirrorBaseGeo = new THREE.CylinderGeometry(3.55, 3.55, 0.2, 64);
            mirrorBaseGeo.rotateX(Math.PI / 2);
            const mirrorMesh = new THREE.Mesh(mirrorBaseGeo, darkObsidianMaterial);
            mirrorMesh.position.z = 0.1;
            baguaGroup.add(mirrorMesh);

            // 4. Yin Yang Center Disc (Âm Dương Bát Quái)
            createYinYangSymbol();
        }

        function createYinYangSymbol() {
            const radius = 3.2;

            // Yang (Gold) Half
            const yangShape = new THREE.Shape();
            yangShape.absarc(0, 0, radius, -Math.PI / 2, Math.PI / 2, false);
            yangShape.absarc(0, radius / 2, radius / 2, Math.PI / 2, -Math.PI / 2, true);
            yangShape.absarc(0, -radius / 2, radius / 2, Math.PI / 2, -Math.PI / 2, false);

            const extrudeOpts = { depth: 0.18, bevelEnabled: true, bevelSize: 0.04, bevelThickness: 0.04, curveSegments: 64 };
            const yangGeo = new THREE.ExtrudeGeometry(yangShape, extrudeOpts);
            
            const goldMaterial = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                metalness: 0.9,
                roughness: 0.2
            });

            const yangMesh = new THREE.Mesh(yangGeo, goldMaterial);
            yangMesh.position.z = 0.2;
            baguaGroup.add(yangMesh);

            // Yin (Obsidian Black) Half
            const yinShape = new THREE.Shape();
            yinShape.absarc(0, 0, radius, Math.PI / 2, -Math.PI / 2, false);
            yinShape.absarc(0, -radius / 2, radius / 2, -Math.PI / 2, Math.PI / 2, true);
            yinShape.absarc(0, radius / 2, radius / 2, -Math.PI / 2, Math.PI / 2, false);

            const yinGeo = new THREE.ExtrudeGeometry(yinShape, extrudeOpts);
            const darkMaterial = new THREE.MeshStandardMaterial({
                color: 0x08080a,
                metalness: 0.5,
                roughness: 0.3
            });

            const yinMesh = new THREE.Mesh(yinGeo, darkMaterial);
            yinMesh.position.z = 0.2;
            baguaGroup.add(yinMesh);

            // Yin & Yang Dots
            const dotGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.22, 32);
            dotGeo.rotateX(Math.PI / 2);

            // Black dot in Gold Yang side
            const blackDot = new THREE.Mesh(dotGeo, darkMaterial);
            blackDot.position.set(0, radius / 2, 0.22);
            baguaGroup.add(blackDot);

            // Gold dot in Black Yin side
            const goldDot = new THREE.Mesh(dotGeo, goldMaterial);
            goldDot.position.set(0, -radius / 2, 0.22);
            baguaGroup.add(goldDot);
        }

        function createSunAndMoon() {
            // Sun Mesh (Radiant Gold Solar Body)
            const sunGeo = new THREE.SphereGeometry(0.85, 32, 32);
            const sunMat = new THREE.MeshStandardMaterial({
                color: 0xffaa00,
                emissive: 0xff6600,
                emissiveIntensity: 0.8,
                roughness: 0.2,
                metalness: 0.8
            });
            sunMesh = new THREE.Mesh(sunGeo, sunMat);

            // Sun Corona Rays
            const coronaGeo = new THREE.TorusGeometry(1.1, 0.05, 16, 32);
            const coronaMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.7 });
            const corona = new THREE.Mesh(coronaGeo, coronaMat);
            sunMesh.add(corona);

            const sunLight = new THREE.PointLight(0xffaa00, 2, 10);
            sunMesh.add(sunLight);

            // Moon Mesh (Detailed Silver Orbital Sphere)
            const moonGeo = new THREE.SphereGeometry(0.7, 32, 32);
            const moonMat = new THREE.MeshStandardMaterial({
                color: 0xddeeff,
                emissive: 0x446688,
                emissiveIntensity: 0.4,
                roughness: 0.4,
                metalness: 0.6
            });
            moonMesh = new THREE.Mesh(moonGeo, moonMat);

            const moonHaloGeo = new THREE.TorusGeometry(0.95, 0.03, 16, 32);
            const moonHaloMat = new THREE.MeshBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.5 });
            const moonHalo = new THREE.Mesh(moonHaloGeo, moonHaloMat);
            moonMesh.add(moonHalo);

            const moonLight = new THREE.PointLight(0x88ccff, 1.2, 8);
            moonMesh.add(moonLight);

            sunMoonGroup.add(sunMesh);
            sunMoonGroup.add(moonMesh);
        }

        function getPointerAngle(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = clientX - (rect.left + rect.width / 2);
            const y = clientY - (rect.top + rect.height / 2);
            return Math.atan2(y, x);
        }

        function onPointerDown(e) {
            // Single tap/click while wheel is spinning fast immediately stops it!
            if (isSpinningFast && Math.abs(angularVelocity) > 0.05) {
                angularVelocity = 0;
                isSpinningFast = false;
                isDragging = false;
                return;
            }

            isDragging = true;
            isSpinningFast = false;
            previousPointerAngle = getPointerAngle(e.clientX, e.clientY);
            lastPointerTime = performance.now();
            angularVelocity = 0;

            lastX = e.clientX;
            lastY = e.clientY;
        }

        function onPointerMove(e) {
            // Update camera/bagua 3D Tilt perspective based on touch/cursor position
            const normX = (e.clientX / window.innerWidth) * 2 - 1;
            const normY = -(e.clientY / window.innerHeight) * 2 + 1;

            targetTiltY = normX * 0.45; // Subtle 3D perspective shift
            targetTiltX = normY * 0.45;

            if (!isDragging) return;

            const currentAngle = getPointerAngle(e.clientX, e.clientY);
            let deltaAngle = currentAngle - previousPointerAngle;

            // Handle wrap-around around PI / -PI
            if (deltaAngle > Math.PI) deltaAngle -= Math.PI * 2;
            if (deltaAngle < -Math.PI) deltaAngle += Math.PI * 2;

            baguaGroup.rotation.z += deltaAngle;

            const now = performance.now();
            const dt = (now - lastPointerTime) / 1000;
            if (dt > 0.001) {
                // Calculate rotational velocity (radians per sec)
                angularVelocity = deltaAngle / dt;
            }

            previousPointerAngle = currentAngle;
            lastPointerTime = now;
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;

            // If release speed is significant, enter free bicycle-wheel spin mode
            if (Math.abs(angularVelocity) > 0.5) {
                isSpinningFast = true;
            }
        }

        function setupGyroscope() {
            const gyroBtn = document.getElementById('gyro-btn');

            function handleOrientation(event) {
                if (event.beta === null || event.gamma === null) return;

                if (!initialGyroSet) {
                    baseBeta = event.beta;
                    baseGamma = event.gamma;
                    initialGyroSet = true;
                }

                // Smooth relative tilting
                const deltaGamma = event.gamma - baseGamma;
                const deltaBeta = event.beta - baseBeta;

                targetTiltY = THREE.MathUtils.clamp(deltaGamma * 0.02, -0.6, 0.6);
                targetTiltX = THREE.MathUtils.clamp(deltaBeta * 0.02, -0.6, 0.6);
            }

            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    // iOS 13+ requiring permission trigger
                    gyroBtn.style.display = 'block';
                    gyroBtn.addEventListener('click', () => {
                        DeviceOrientationEvent.requestPermission()
                            .then(response => {
                                if (response === 'granted') {
                                    window.addEventListener('deviceorientation', handleOrientation, true);
                                    gyroBtn.style.display = 'none';
                                }
                            })
                            .catch(console.error);
                    });
                } else {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.001;

            // 1. Bicycle Wheel Inertia Physics
            if (!isDragging) {
                if (Math.abs(angularVelocity) > 0.0001) {
                    baguaGroup.rotation.z += angularVelocity * 0.016;
                    
                    // Very low friction for prolonged "spinning bicycle wheel" inertia
                    const friction = isSpinningFast ? 0.994 : 0.95;
                    angularVelocity *= friction;

                    if (Math.abs(angularVelocity) < 0.05) {
                        isSpinningFast = false;
                    }
                } else {
                    // Subtle background float spin when completely idle
                    baguaGroup.rotation.z += 0.0015;
                }
            }

            // 2. Smooth 3D Motion Perspective Tilt (Mouse & Gyroscope)
            currentTiltX += (targetTiltX - currentTiltX) * 0.06;
            currentTiltY += (targetTiltY - currentTiltY) * 0.06;

            mainGroup.rotation.x = currentTiltX;
            mainGroup.rotation.y = currentTiltY;

            // 3. Symmetrical Sun & Moon Orbit Motion around Bagua
            const orbitRadius = 7.2;
            const orbitSpeed = time * 0.5;

            sunMesh.position.x = Math.cos(orbitSpeed) * orbitRadius;
            sunMesh.position.y = Math.sin(orbitSpeed) * orbitRadius;
            sunMesh.position.z = Math.sin(orbitSpeed * 2) * 0.8;

            moonMesh.position.x = Math.cos(orbitSpeed + Math.PI) * orbitRadius;
            moonMesh.position.y = Math.sin(orbitSpeed + Math.PI) * orbitRadius;
            moonMesh.position.z = -Math.sin(orbitSpeed * 2) * 0.8;

            // Rotate Sun & Moon around their own axes
            sunMesh.rotation.y += 0.01;
            moonMesh.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        // Initialize on window load
        window.onload = function() {
            initScene();
        };
    </script>
</body>
</html>
